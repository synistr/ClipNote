name: iOS

# Ad hoc build for over-the-air install from apps.fkeil.com (template: ~/chattr-ota/templates/ios.yml
# on the VPS). Every push to the default branch builds a Release IPA and uploads it, encrypted, as
# the `ipa` artifact: artifacts of public repos are downloadable by anyone, and the embedded profile
# lists device UDIDs. The VPS pulls and decrypts it. Without the signing secrets, runs are
# compile-only.
#
# Signing needs no project changes beyond bundle IDs and team: an xcconfig override gives every target
# the profile matching its bundle ID (IOS_ADHOC_PROFILES_BASE64), and Swift package targets get none.
#
# Built with Xcode 27 or newer (the iOS 27 SDK), and incrementally, like Flow: DerivedData is cached
# between runs, unchanged files get back the times the last build saw, and the app is built rather
# than archived (an archive recompiles everything), then zipped into the IPA. The cache is encrypted
# with ARTIFACT_KEY, since a public repo's caches are readable beyond it and DerivedData holds the
# signed app.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODEGEN_VERSION: 2.46.0
  TEAM_ID: LB39V3CF77
  # Default: the only *.xcodeproj at the repo root (generated first if there is a project.yml), and
  # the scheme named like it.
  PROJECT: ''
  SCHEME: ''

jobs:
  build:
    # GitHub's Xcode 27 image. Override without a code change: gh variable set MACOS_RUNNER --body <label>
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.IOS_DIST_P12_BASE64 != '' && secrets.IOS_ADHOC_PROFILES_BASE64 != '' && secrets.ARTIFACT_KEY != '' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Select Xcode 27
        id: xcode
        run: |
          # Newest released Xcode 27+, for the iOS 27 SDK; no falling back to an older one. Runner
          # images ship betas next to releases and alias them (Xcode_27.2.app ->
          # Xcode_27.2_beta_2.app), so skip apps whose real path says beta, plus seed builds like
          # 27A5228h.
          pick=$(for app in /Applications/Xcode*.app; do
              plist="$app/Contents/version.plist"
              [ -f "$plist" ] || continue
              version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
              build=$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$plist")
              real=$(cd "$app" && pwd -P)
              echo "$app -> $real: $version ($build)" >&2
              [[ $real == *[Bb]eta* ]] && continue
              [[ $build =~ ^[0-9]+[A-Z]5[0-9]{3}[a-z]$ ]] && continue
              [[ ${version%%.*} -ge 27 ]] || continue
              echo "$version $app"
            done | sort -V | tail -1 | cut -d' ' -f2-)
          [ -n "$pick" ] || { echo "::error::No released Xcode 27+ on this runner (runs-on should be xcode-27)"; exit 1; }
          echo "DEVELOPER_DIR=$pick/Contents/Developer" >> "$GITHUB_ENV"
          echo "build=$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$pick/Contents/version.plist")" >> "$GITHUB_OUTPUT"
          DEVELOPER_DIR="$pick/Contents/Developer" xcodebuild -version

      # Started right after picking Xcode, so a fresh runner loads Xcode's tools from disk while the
      # cache restores rather than during the build (the first xcodebuild on a runner spends ~3s more
      # starting up and asking them about themselves), as in Flow.
      - name: Warm up Xcode
        run: |
          nohup bash -c 'xcodebuild -version; xcrun --sdk iphoneos --show-sdk-path
            xcrun clang -v -E -dM -x c /dev/null; xcrun swiftc --version; xcrun swift-frontend -version
            xcrun ld -version_details; xcrun actool --version' > "$RUNNER_TEMP/warm-xcode.log" 2>&1 &

      - name: Find the project
        run: |
          if [ -f project.yml ]; then
            curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
              "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
            unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
            "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --quiet
          fi
          project=$PROJECT
          if [ -z "$project" ]; then
            set -- *.xcodeproj
            if [ $# -ne 1 ] || [ ! -d "$1" ]; then
              echo "::error::Expected one *.xcodeproj at the repo root, found: $*. Set PROJECT in ios.yml."
              exit 1
            fi
            project=$1
          fi
          scheme=${SCHEME:-$(basename "$project" .xcodeproj)}
          echo "Project: $project, scheme: $scheme"
          echo "PROJECT=$project" >> "$GITHUB_ENV"
          echo "SCHEME=$scheme" >> "$GITHUB_ENV"

          # xcb: xcodebuild with the full log in $RUNNER_TEMP/xcodebuild.log, printing only errors and
          # the result line, so `gh run view --log-failed` stays short.
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/xcb" <<'EOF'
          #!/bin/bash
          log="$RUNNER_TEMP/xcodebuild.log"
          xcodebuild "$@" >> "$log" 2>&1
          status=$?
          grep -E 'error: |\*\* [A-Z ]+ (SUCCEEDED|FAILED) \*\*' "$log" | awk '!seen[$0]++'
          echo "($(grep -c 'warning: ' "$log") warning lines; full log: xcodebuild-log artifact on failure)"
          if [ $status -ne 0 ]; then
            echo "--- last 40 log lines ---"
            tail -40 "$log"
          fi
          exit $status
          EOF
          chmod +x "$RUNNER_TEMP/bin/xcb"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The last build's DerivedData (see Pack DerivedData), if the same Xcode made it: another
      # one's would only be rebuilt from scratch.
      - name: Restore DerivedData
        if: env.HAS_SIGNING == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/deriveddata.tar.zst.enc
          key: deriveddata-${{ steps.xcode.outputs.build }}-${{ github.run_id }}
          restore-keys: deriveddata-${{ steps.xcode.outputs.build }}-

      - name: Install signing assets
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILES_BASE64: ${{ secrets.IOS_ADHOC_PROFILES_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 -A
          rm "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          # The secret is a base64 tar.gz of one ad hoc profile per bundle ID (apps.py signing).
          profiles="$RUNNER_TEMP/profiles"
          mkdir -p "$profiles"
          echo "$PROFILES_BASE64" | base64 --decode | tar -xzf - -C "$profiles"
          xcconfig="$RUNNER_TEMP/signing.xcconfig"
          cat > "$xcconfig" <<EOF
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          DEVELOPMENT_TEAM = $TEAM_ID
          PROVISIONING_PROFILE_SPECIFIER = \$(ADHOC_PROFILE_\$(PRODUCT_BUNDLE_IDENTIFIER:c99extidentifier))
          EOF
          for profile in "$profiles"/*.mobileprovision; do
            security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
            app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
            bundle_id=${app_id#*.}
            for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                       "$HOME/Library/MobileDevice/Provisioning Profiles"; do
              mkdir -p "$dir" && cp "$profile" "$dir/$uuid.mobileprovision"
            done
            echo "ADHOC_PROFILE_$(printf '%s' "$bundle_id" | tr -c 'A-Za-z0-9_' '_') = $name" >> "$xcconfig"
            echo "Profile: $name ($bundle_id, $uuid), expires $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")"
          done
          cat "$xcconfig"
          echo "SIGNING_XCCONFIG=$xcconfig" >> "$GITHUB_ENV"

      # After the project is generated, since generating can rewrite files.
      - name: Prepare incremental build
        if: env.HAS_SIGNING == 'true'
        shell: bash  # with pipefail
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          # file-times save|restore LIST. A fresh checkout dates every file "now", which would make the
          # cached DerivedData see every file as changed. `save` records each tracked file's content
          # hash and time; `restore` gives every file whose content is unchanged its recorded time
          # back. The others are cut to whole seconds, as recorded, so the next run restores exactly
          # the time this build saw. Directories then get their newest file's time, since folder
          # inputs like asset catalogs go by directory times.
          cat > "$RUNNER_TEMP/bin/file-times" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          list=$2
          tracked() {
            git -c core.quotepath=off ls-files -s --recurse-submodules
          }
          case $1 in
            save)
              tracked | perl -ne '
                chomp;
                my ($meta, $path) = split /\t/, $_, 2;
                my $hash = (split / /, $meta)[1];
                my $time = (stat $path)[9];
                print "$hash $time\t$path\n" if defined $time;
              ' > "$list"
              ;;
            restore)
              [ -f "$list" ] || list=/dev/null
              tracked | perl -ne '
                BEGIN {
                  open my $saved, "<", shift @ARGV or die;
                  while (<$saved>) {
                    chomp;
                    my ($meta, $path) = split /\t/, $_, 2;
                    $recorded{$path} = [split / /, $meta];
                  }
                }
                chomp;
                my ($meta, $path) = split /\t/, $_, 2;
                my $hash = (split / /, $meta)[1];
                my $old = $recorded{$path};
                my $time = $old && $old->[0] eq $hash ? $old->[1] : (stat $path)[9] // next;
                utime $time, $time, $path;
                for (my $dir = $path; $dir =~ s{/[^/]+$}{};) {
                  $newest{$dir} = $time if $time > ($newest{$dir} // 0);
                }
                END { utime $newest{$_}, $newest{$_}, $_ for keys %newest }
              ' "$list"
              ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/bin/file-times"

          command -v zstd > /dev/null || brew install --quiet zstd
          dd="$RUNNER_TEMP/DerivedData"
          archive="$RUNNER_TEMP/deriveddata.tar.zst.enc"
          if [ -f "$archive" ]; then
            if "$(brew --prefix openssl@3)/bin/openssl" enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
                -pass env:ARTIFACT_KEY -in "$archive" | zstd -q -d | tar -C "$RUNNER_TEMP" -xf -; then
              size=$(du -sm "$dd" | cut -f1)
              echo "DerivedData from the last build: $size MB"
              # Restoring gets slower with size, so start over if it ever passes 1 GB.
              if [ "$size" -gt 1024 ]; then
                echo "Over 1 GB; building from scratch"
                rm -rf "$dd"
              fi
            else
              echo "::warning::Couldn't unpack the cached DerivedData; building from scratch"
              rm -rf "$dd"
            fi
            rm "$archive"
          else
            echo "No cached DerivedData; building from scratch"
          fi
          # The app is put together anew (copied resources, link, signature) from the cached objects,
          # so nothing the project dropped lingers in it, and the only app left is this build's.
          rm -rf "$dd"/Build/Products/*-iphoneos/*.app
          file-times restore "$dd/file-times.txt"
          # Xcode also checks inodes, which never survive a cache restore.
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      - name: Compile check (unsigned)
        if: env.HAS_SIGNING != 'true'
        run: |
          xcb build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO

      # A plain build rather than an archive: `xcodebuild archive` recompiles everything every time,
      # while a build reuses the cached DerivedData, and it already signs the app and its extensions
      # for ad hoc. For speed, as in Flow: Swift compiles file by file (Release otherwise compiles
      # each module as a whole, so any change recompiles all of it), no debug info or dSYM (crash
      # logs still get function names from the unstripped binary), no localizable-strings
      # extraction, and no compilation cache (its keys cover all of a module's sources, so it rarely
      # hits).
      - name: Build
        if: env.HAS_SIGNING == 'true'
        run: |
          xcb build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -xcconfig "$SIGNING_XCCONFIG" \
            -skipPackagePluginValidation -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO COMPILATION_CACHE_ENABLE_CACHING=NO \
            SWIFT_COMPILATION_MODE=singlefile \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO DEBUG_INFORMATION_FORMAT=dwarf \
            SWIFT_EMIT_LOC_STRINGS=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          file-times save "$RUNNER_TEMP/DerivedData/file-times.txt"
          log="$RUNNER_TEMP/xcodebuild.log"
          echo "$(grep -c '^SwiftCompile ' "$log") Swift and $(grep -c '^CompileC ' "$log") C compile tasks ran"

      - name: Package, verify, describe and encrypt the IPA
        id: package
        if: env.HAS_SIGNING == 'true'
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          shopt -s nullglob
          built=("$RUNNER_TEMP"/DerivedData/Build/Products/*-iphoneos/*.app)
          [ ${#built[@]} -eq 1 ] || { echo "::error::Expected the build to make one app, found: ${built[*]}"; exit 1; }
          payload="$RUNNER_TEMP/export/Payload"
          mkdir -p "$payload"
          cp -R "${built[0]}" "$payload/"
          app="$payload/$(basename "${built[0]}")"
          codesign --verify --deep --strict "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          xcrun vtool -show-build "$app/$executable" | grep -E 'platform|minos|sdk'
          ipa="$RUNNER_TEMP/export/app.ipa"
          (cd "$RUNNER_TEMP/export" && zip -qry "$ipa" Payload)
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          jq -n \
            --arg build "$BUILD_NUMBER" \
            --arg version "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" \
            --arg bundle_id "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" \
            --arg sha "$GITHUB_SHA" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg message "$(git log -1 --format=%s)" \
            --arg xcode "$(xcodebuild -version | head -1)" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '$ARGS.named' > "$out/build-info.json"
          cat "$out/build-info.json"
          # OpenSSL 3 from Homebrew, so the VPS (OpenSSL 3) decrypts with the same KDF.
          openssl="$(brew --prefix openssl@3)/bin/openssl"
          "$openssl" enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt -pass env:ARTIFACT_KEY \
            -in "$ipa" -out "$out/app.ipa.enc"

      - name: Upload IPA
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: ${{ runner.temp }}/out/
          retention-days: 3
          compression-level: 0

      # Full pax, not tar's default "restricted" pax, which drops the sub-second part of file times:
      # Xcode compares its outputs' times exactly, so every task would rerun. always(): a newer push
      # cancelling this run after the upload still lets it save, so that run starts from this cache.
      - name: Pack DerivedData
        id: pack
        if: always() && steps.package.outcome == 'success'
        shell: bash  # with pipefail
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          archive="$RUNNER_TEMP/deriveddata.tar.zst.enc"
          tar --format pax -C "$RUNNER_TEMP" -cf - DerivedData | zstd -q -T0 \
            | "$(brew --prefix openssl@3)/bin/openssl" enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
                -pass env:ARTIFACT_KEY -out "$archive"
          echo "DerivedData: $(du -sm "$RUNNER_TEMP/DerivedData" | cut -f1) MB, packed $(du -sm "$archive" | cut -f1) MB"

      - name: Save DerivedData
        if: always() && steps.pack.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/deriveddata.tar.zst.enc
          key: deriveddata-${{ steps.xcode.outputs.build }}-${{ github.run_id }}

      - name: Upload xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Remove signing keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN"
